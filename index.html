<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Scritchy Scratchy</title><link rel="stylesheet" href="styles.css"><script src="https://telegram.org/js/telegram-web-app.js"></script></head><body><main class="shell"><header><div><small>SCRITCHY SCRATCHY</small><h1>Твой стол</h1></div><div class="money">$<span id="money">100</span></div></header><nav><button class="tab active" data-tab="table">СТОЛ</button><button class="tab" data-tab="shop">МАГАЗИН</button><button class="tab" data-tab="catalog">КАТАЛОГ</button></nav><section id="table" class="panel active"><div class="tabletop"><div class="ticket-head"><span>Mini Scratch</span><b>$5</b></div><div id="scratchGrid" class="scratch-grid"></div><div class="ticket-actions"><button id="newTicket" class="gold">Купить билет</button><button id="autoScratch" class="dark">Авто</button></div></div><div class="run-stats"><div>Билетов <b id="tickets">0</b></div><div>Выигрыш <b id="earned">$0</b></div><div>Рекорд <b id="best">$0</b></div></div></section><section id="shop" class="panel"><h2>Улучшения</h2><div id="upgrades" class="cards"></div></section><section id="catalog" class="panel"><h2>Каталог билетов</h2><div id="catalogCards" class="cards"></div></section><footer><span id="status">Готов к игре</span><button id="reset">Сбросить прогресс</button></footer></main><script src="app.js"></script></body></html>
